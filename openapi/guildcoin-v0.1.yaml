openapi: 3.1.1
info:
  title: Guildcoin proposed merchant interface
  version: 0.1.0-draft
  description: Non-operational discussion draft. Reserved example hostnames. No currency, wallet, ledger
    or service exists by virtue of this contract.
servers:
- url: https://sandbox-api.guildcoin.example
  description: Reserved example hostname, NOT a working server
tags:
- name: Checkouts
- name: Refunds
- name: Reconciliation
paths:
  /v1/checkouts:
    post:
      summary: Create a hosted-wallet checkout session
      operationId: createCheckout
      security:
      - MerchantOAuth:
        - checkout:create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID scoped to merchant, method and path; repeat on timeout with identical body.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckout'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        '400':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/checkouts/{checkout_id}:
    get:
      summary: Retrieve a merchant-owned checkout (the payment source of truth)
      operationId: getCheckout
      security:
      - MerchantOAuth:
        - checkout:read
      parameters:
      - name: checkout_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current checkout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
        '401':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/refunds:
    post:
      summary: Request refund of merchant-owned completed checkout
      operationId: createRefund
      security:
      - MerchantOAuth:
        - refund:create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID scoped to merchant, method and path; repeat on timeout with identical body.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefund'
      responses:
        '202':
          description: Refund pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/refunds/{refund_id}:
    get:
      summary: Retrieve a merchant-owned refund
      operationId: getRefund
      security:
      - MerchantOAuth:
        - refund:read
      parameters:
      - name: refund_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Current refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '401':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/transactions:
    get:
      summary: List merchant transaction receipts for reconciliation
      operationId: listTransactions
      security:
      - MerchantOAuth:
        - transaction:read
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Reconciliation records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Problem Details (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
webhooks:
  merchantNotification:
    post:
      summary: Operator-originated merchant event (signed raw body)
      description: HMAC-SHA256 signature over ASCII timestamp + '.' + raw body; see SPEC.md and SECURITY.md.
        At-least-once and possibly out of order.
      parameters:
      - in: header
        name: Guildcoin-Timestamp
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
      - in: header
        name: Guildcoin-Signature
        required: true
        schema:
          type: string
          pattern: ^v1=[a-f0-9]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Accepted for processing
        '204':
          description: Accepted (no body)
components:
  securitySchemes:
    MerchantOAuth:
      type: oauth2
      description: Server-to-server credential only; the token issuer is not deployed.
      flows:
        clientCredentials:
          tokenUrl: https://sandbox-auth.guildcoin.example/oauth2/token
          scopes:
            checkout:create: Proposed merchant scope
            checkout:read: Proposed merchant scope
            refund:create: Proposed merchant scope
            refund:read: Proposed merchant scope
            transaction:read: Proposed merchant scope
  schemas:
    Amount:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 19
      description: Positive integer string of GC minor units; 100 minor units = 1 GC, not fiat.
    CreateCheckout:
      type: object
      additionalProperties: false
      required:
      - merchant_order_id
      - amount_minor
      - currency
      - description
      - return_url
      - cancel_url
      properties:
        merchant_order_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Merchant-unique order reference.
        amount_minor:
          $ref: '#/components/schemas/Amount'
        currency:
          type: string
          const: GC
        description:
          type: string
          minLength: 1
          maxLength: 240
        return_url:
          type: string
          format: uri
          pattern: ^https://
        cancel_url:
          type: string
          format: uri
          pattern: ^https://
    Checkout:
      type: object
      additionalProperties: false
      required:
      - id
      - merchant_order_id
      - amount_minor
      - currency
      - state
      - checkout_url
      - created_at
      - expires_at
      - transaction_id
      properties:
        id:
          type: string
        merchant_order_id:
          type: string
        amount_minor:
          $ref: '#/components/schemas/Amount'
        currency:
          type: string
          const: GC
        state:
          type: string
          enum:
          - open
          - completed
          - cancelled
          - expired
        checkout_url:
          type: string
          format: uri
          pattern: ^https://
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        transaction_id:
          type:
          - string
          - 'null'
    CreateRefund:
      type: object
      additionalProperties: false
      required:
      - checkout_id
      - amount_minor
      - reason
      properties:
        checkout_id:
          type: string
        amount_minor:
          $ref: '#/components/schemas/Amount'
        reason:
          type: string
          enum:
          - requested_by_player
          - fulfillment_failed
          - other
    Refund:
      type: object
      additionalProperties: false
      required:
      - id
      - checkout_id
      - amount_minor
      - state
      - created_at
      - transaction_id
      properties:
        id:
          type: string
        checkout_id:
          type: string
        amount_minor:
          $ref: '#/components/schemas/Amount'
        state:
          type: string
          enum:
          - pending
          - succeeded
          - rejected
        created_at:
          type: string
          format: date-time
        transaction_id:
          type:
          - string
          - 'null'
    Transaction:
      type: object
      additionalProperties: false
      required:
      - id
      - checkout_id
      - refund_id
      - kind
      - amount_minor
      - currency
      - occurred_at
      properties:
        id:
          type: string
        checkout_id:
          type: string
        refund_id:
          type:
          - string
          - 'null'
        kind:
          type: string
          enum:
          - checkout
          - refund
        amount_minor:
          $ref: '#/components/schemas/Amount'
        currency:
          type: string
          const: GC
        occurred_at:
          type: string
          format: date-time
    TransactionPage:
      type: object
      additionalProperties: false
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        next_cursor:
          type:
          - string
          - 'null'
    WebhookEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - occurred_at
      - data
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - checkout.completed
          - refund.succeeded
          - refund.rejected
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
